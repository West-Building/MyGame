<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>像素风机甲对战</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
            font-family: monospace;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #gameCanvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background: #1a1a2e;
        }
        .touchControl {
            position: absolute;
            pointer-events: none;
            display: none;
        }
        .touchControl.active {
            display: block;
        }
        #joystickArea {
            left: 0;
            bottom: 0;
            width: 50%;
            height: 40%;
        }
        #buttonArea {
            right: 0;
            bottom: 0;
            width: 50%;
            height: 40%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 5%;
            gap: 8px;
        }
        .joystick {
            position: absolute;
            width: 28vw;
            height: 28vw;
            max-width: 120px;
            max-height: 120px;
            min-width: 80px;
            min-height: 80px;
            border-radius: 50%;
            background: rgba(255,255,255,0.12);
            border: 3px solid rgba(255,255,255,0.25);
            pointer-events: auto;
            touch-action: none;
            left: 5%;
            bottom: 5%;
        }
        .joystickKnob {
            position: absolute;
            width: 40%;
            height: 40%;
            border-radius: 50%;
            background: rgba(255,255,255,0.35);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        .skillButton {
            pointer-events: auto;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(10px, 3vw, 16px);
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px black;
            border: 3px solid rgba(255,255,255,0.4);
            transition: transform 0.05s;
        }
        .skillButton:active, .skillButton.pressed {
            transform: scale(0.9);
            opacity: 0.8;
        }
        #attackBtn {
            width: 18vw;
            height: 18vw;
            max-width: 75px;
            max-height: 75px;
            min-width: 55px;
            min-height: 55px;
            border-radius: 50%;
            background: rgba(230, 57, 70, 0.55);
        }
        #defendBtn {
            width: 13vw;
            height: 13vw;
            max-width: 55px;
            max-height: 55px;
            min-width: 40px;
            min-height: 40px;
            border-radius: 8px;
            background: rgba(67, 97, 238, 0.55);
        }
        #ultimateBtn {
            width: 15vw;
            height: 15vw;
            max-width: 65px;
            max-height: 65px;
            min-width: 50px;
            min-height: 50px;
            border-radius: 50%;
            background: rgba(244, 162, 97, 0.55);
            animation: ultimatePulse 0.8s infinite;
        }
        @keyframes ultimatePulse {
            0%, 100% { box-shadow: 0 0 10px rgba(255,209,102,0.4); }
            50% { box-shadow: 0 0 20px rgba(255,209,102,0.8); }
        }
        .buttonRow {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }
        #connectionOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 26, 46, 0.97);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #f1faee;
            padding: 20px;
            text-align: center;
            overflow-y: auto;
        }
        .hidden { display: none !important; }
        .overlay-content {
            width: 100%;
            max-width: 400px;
        }
        .btn {
            padding: 14px 28px;
            font-size: clamp(14px, 4vw, 18px);
            font-family: monospace;
            background: #4361ee;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 8px;
            min-width: 180px;
            width: 80%;
            max-width: 280px;
        }
        .btn:hover { background: #3a56d4; }
        .btn:active { transform: scale(0.95); }
        .btn.red { background: #e63946; }
        .btn.red:hover { background: #d62839; }
        .btn.green { background: #2ec4b6; }
        .btn.green:hover { background: #25a89d; }
        .btn.orange { background: #f4a261; }
        .btn.orange:hover { background: #e8934d; }
        .roomInfo {
            background: rgba(255,255,255,0.08);
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            word-break: break-all;
        }
        .roomCode {
            font-size: clamp(20px, 6vw, 28px);
            color: #ffd166;
            margin: 10px 0;
            letter-spacing: 3px;
        }
        input {
            padding: 12px;
            font-size: 16px;
            font-family: monospace;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            color: white;
            width: 80%;
            max-width: 260px;
            text-align: center;
            margin: 5px 0;
        }
        input::placeholder { color: rgba(255,255,255,0.4); }
        .status { color: #f4a261; margin: 10px 0; font-size: clamp(12px, 3vw, 14px); }
        .error { color: #e63946; }
        .title {
            font-size: clamp(22px, 7vw, 32px);
            margin-bottom: 8px;
        }
        .subtitle {
            color: #888;
            margin-bottom: 25px;
            font-size: clamp(12px, 3vw, 14px);
        }
        .difficulty-info {
            font-size: clamp(11px, 2.8vw, 13px);
            color: #aaa;
            margin: 5px 0;
        }
        @media (max-width: 480px) {
            .touchControl { pointer-events: auto; }
            .touchControl.active { display: block; }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="joystickArea" class="touchControl">
            <div id="joystick" class="joystick">
                <div id="joystickKnob" class="joystickKnob"></div>
            </div>
        </div>
        
        <div id="buttonArea" class="touchControl">
            <div class="buttonRow">
                <div id="defendBtn" class="skillButton">防</div>
            </div>
            <div class="buttonRow">
                <div id="attackBtn" class="skillButton">攻</div>
                <div id="ultimateBtn" class="skillButton">大</div>
            </div>
        </div>
    </div>

    <div id="connectionOverlay">
        <div class="overlay-content" id="menuSection">
            <h1 class="title">⚔️ 机甲对战 ⚔️</h1>
            <p class="subtitle">局域网联机 | 移动端适配</p>
            
            <button class="btn" onclick="showPracticeMenu()">🎮 单人练习</button>
            <button class="btn" onclick="showLocalPVP()">⌨️ 本地双人对战</button>
            <button class="btn" onclick="showMultiplayerMenu()">📡 局域网对战</button>
        </div>
        
        <div class="overlay-content hidden" id="practiceSection">
            <h2 style="margin-bottom: 15px;">选择难度</h2>
            <button class="btn green" onclick="startPractice('easy')">🌱 简单</button>
            <p class="difficulty-info">AI反应较慢，适合新手练习</p>
            <button class="btn orange" onclick="startPractice('hard')">🔥 困难</button>
            <p class="difficulty-info">AI反应迅速，需要策略性操作</p>
            <button class="btn red" onclick="returnToMain()" style="margin-top: 15px;">← 返回</button>
        </div>
        
        <div class="overlay-content hidden" id="multiplayerSection">
            <button class="btn" onclick="createRoom()">🏠 创建房间</button>
            <button class="btn" onclick="showJoinRoom()">🔍 加入房间</button>
            <button class="btn red" onclick="returnToMain()">← 返回</button>
        </div>
        
        <div class="overlay-content hidden" id="createRoomSection">
            <h2>房间已创建</h2>
            <p>分享房间码给好友：</p>
            <div class="roomInfo">
                <div class="roomCode" id="roomCodeDisplay">...</div>
                <p style="font-size: 12px; color: #aaa;">等待对方加入...</p>
            </div>
            <div class="status" id="waitingStatus"></div>
            <button class="btn red" onclick="cancelRoom()">取消</button>
        </div>
        
        <div class="overlay-content hidden" id="joinRoomSection">
            <h2>加入房间</h2>
            <p>输入好友的房间码：</p>
            <input type="text" id="roomCodeInput" placeholder="输入房间码..." maxlength="6">
            <button class="btn green" onclick="joinRoom()">连接</button>
            <div class="status" id="joinStatus"></div>
            <button class="btn red" onclick="cancelJoin()">取消</button>
        </div>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const LOGICAL_WIDTH = 320;
const LOGICAL_HEIGHT = 180;
let SCALE = 3;

let gameState = 'menu';
let isOnline = false;
let isLocalPVP = false;
let isPractice = false;
let aiDifficulty = 'easy';
let isHost = false;
let peer = null;
let conn = null;
let myPlayerId = null;

const colors = {
    bg: '#1a1a2e',
    ground: '#4a4e69',
    p1Color: '#e63946',
    p2Color: '#4361ee',
    hpBar: '#2ec4b6',
    energyBar: '#f4a261',
    text: '#f1faee',
    accent: '#ffd166'
};

const mechas = {
    flame: {
        name: '烈焰',
        color: '#e63946',
        secondaryColor: '#ff6b6b',
        attackType: 'melee',
        damage: 15,
        ultimateDamage: 35,
        speed: 2
    },
    frost: {
        name: '寒霜',
        color: '#4361ee',
        secondaryColor: '#748ffc',
        attackType: 'range',
        damage: 12,
        ultimateDamage: 30,
        speed: 2.5
    }
};

let localMecha = null;
let remoteMecha = null;
let localSelection = null;
let remoteSelection = null;

let p1Input = { direction: { x: 0, y: 0 }, attack: false, defend: false, ultimate: false, attackPressed: false, defendPressed: false, ultimatePressed: false };
let p2Input = { direction: { x: 0, y: 0 }, attack: false, defend: false, ultimate: false, attackPressed: false, defendPressed: false, ultimatePressed: false };

const keys = {};

let particles = [];
let screenShake = 0;

let isTouchDevice = false;

function initCanvas() {
    const container = document.getElementById('gameContainer');
    const aspectRatio = LOGICAL_WIDTH / LOGICAL_HEIGHT;
    
    let width = container.clientWidth;
    let height = container.clientHeight;
    
    if (width / height > aspectRatio) {
        width = height * aspectRatio;
    } else {
        height = width / aspectRatio;
    }
    
    SCALE = Math.floor(width / LOGICAL_WIDTH);
    SCALE = Math.max(2, SCALE);
    
    canvas.width = LOGICAL_WIDTH * SCALE;
    canvas.height = LOGICAL_HEIGHT * SCALE;
    canvas.style.width = canvas.width + 'px';
    canvas.style.height = canvas.height + 'px';
    
    ctx.imageSmoothingEnabled = false;
    
    canvas.addEventListener('click', handleClick);
}

function handleClick(e) {
    if (gameState === 'select') {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) / SCALE;
        const y = (e.clientY - rect.top) / SCALE;
        
        if (y > 80 && y < 135) {
            if (x > 60 && x < 155) {
                selectMecha('flame');
            } else if (x > 165 && x < 260) {
                selectMecha('frost');
            }
        }
    } else if (gameState === 'result') {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) / SCALE;
        const y = (e.clientY - rect.top) / SCALE;
        
        if (y > 130 && y < 158) {
            if (x > 100 && x < 160) {
                restartGame();
            } else if (x > 170 && x < 250) {
                returnToMenu();
            }
        }
    }
}

function createMecha(type, isLocal, x) {
    const template = mechas[type];
    return {
        type: type,
        x: x,
        y: 130,
        width: 24,
        height: 32,
        hp: 100,
        maxHp: 100,
        energy: 100,
        maxEnergy: 100,
        speed: template.speed,
        facing: isLocal ? 'right' : 'left',
        state: 'idle',
        animFrame: 0,
        animTimer: 0,
        attackTimer: 0,
        hitTimer: 0,
        invincible: false,
        invincibleTimer: 0,
        isLocal: isLocal
    };
}

function updateMecha(mecha, dt) {
    if (!mecha) return;
    
    if (mecha.attackTimer > 0) mecha.attackTimer -= dt;
    if (mecha.hitTimer > 0) mecha.hitTimer -= dt;
    
    if (mecha.invincibleTimer > 0) {
        mecha.invincibleTimer -= dt;
        mecha.invincible = true;
    } else {
        mecha.invincible = false;
    }
    
    if (mecha.state === 'hit') {
        if (mecha.hitTimer <= 0) mecha.state = 'idle';
    }
    
    if (mecha.state === 'attack' || mecha.state === 'ultimate') {
        if (mecha.attackTimer <= 0) mecha.state = 'idle';
    }
    
    mecha.animTimer += dt;
    if (mecha.animTimer > 150) {
        mecha.animTimer = 0;
        mecha.animFrame = (mecha.animFrame + 1) % 4;
    }
}

function updateMechaFromInput(mecha, inputObj, dt) {
    if (!mecha) return;
    
    const dir = inputObj.direction;
    let moving = false;
    
    if (dir.x !== 0 || dir.y !== 0) {
        mecha.x += dir.x * mecha.speed;
        mecha.x = Math.max(10, Math.min(LOGICAL_WIDTH - 34, mecha.x));
        
        if (dir.x > 0) mecha.facing = 'right';
        else if (dir.x < 0) mecha.facing = 'left';
        
        if (mecha.state !== 'attack' && mecha.state !== 'ultimate') {
            mecha.state = 'walk';
        }
        moving = true;
    }
    
    if (!moving && mecha.state === 'walk') mecha.state = 'idle';
    
    if (inputObj.attack && !inputObj.attackPressed && mecha.attackTimer <= 0) {
        performAttack(mecha);
        inputObj.attackPressed = true;
    }
    if (!inputObj.attack) inputObj.attackPressed = false;
    
    if (inputObj.ultimate && !inputObj.ultimatePressed && mecha.energy >= 100 && mecha.attackTimer <= 0) {
        performUltimate(mecha);
        inputObj.ultimatePressed = true;
    }
    if (!inputObj.ultimate) inputObj.ultimatePressed = false;
    
    if (inputObj.defend && mecha.state !== 'attack' && mecha.state !== 'ultimate') {
        mecha.state = 'defend';
    } else if (mecha.state === 'defend' && !inputObj.defend) {
        mecha.state = 'idle';
    }
    
    mecha.energy = Math.min(mecha.maxEnergy, mecha.energy + 2 * dt / 1000);
}

function performAttack(mecha) {
    mecha.state = 'attack';
    mecha.attackTimer = 300;
    checkAttackHit(mecha);
}

function performUltimate(mecha) {
    mecha.state = 'ultimate';
    mecha.attackTimer = 500;
    mecha.energy = 0;
    screenShake = 15;
    createUltimateEffect(mecha);
    checkUltimateHit(mecha);
}

function checkAttackHit(attacker) {
    const target = attacker.isLocal ? remoteMecha : localMecha;
    if (!target) return;
    
    const template = mechas[attacker.type];
    const range = template.attackType === 'melee' ? 40 : 80;
    
    let dx = target.x - attacker.x;
    if (attacker.facing === 'left') dx = attacker.x - target.x;
    
    if (dx > 0 && dx < range && Math.abs(target.y - attacker.y) < 20) {
        let damage = template.damage;
        if (target.state === 'defend') {
            damage = Math.floor(damage * 0.3);
            createDefendEffect(target);
        }
        applyDamage(target, damage, attacker);
    }
}

function checkUltimateHit(attacker) {
    const target = attacker.isLocal ? remoteMecha : localMecha;
    if (!target) return;
    
    const range = 100;
    let dx = target.x - attacker.x;
    if (attacker.facing === 'left') dx = attacker.x - target.x;
    
    if (dx > 0 && dx < range && Math.abs(target.y - attacker.y) < 30) {
        let damage = mechas[attacker.type].ultimateDamage;
        if (target.state === 'defend') {
            damage = Math.floor(damage * 0.3);
            createDefendEffect(target);
        }
        applyDamage(target, damage, attacker);
    }
}

function applyDamage(target, damage, attacker) {
    if (target.invincible) return;
    
    target.hp = Math.max(0, target.hp - damage);
    target.state = 'hit';
    target.hitTimer = 200;
    target.invincibleTimer = 300;
    
    const knockback = attacker.facing === 'right' ? -8 : 8;
    target.x += knockback;
    target.x = Math.max(10, Math.min(LOGICAL_WIDTH - 34, target.x));
    
    createHitEffect(target);
    
    if (isOnline && attacker.isLocal && conn) {
        conn.send({ type: 'damage', targetHp: target.hp, timestamp: Date.now() });
    }
    
    if (target.hp <= 0) {
        endBattle(attacker.isLocal);
    }
}

function createHitEffect(mecha) {
    for (let i = 0; i < 8; i++) {
        particles.push({
            x: mecha.x + mecha.width / 2,
            y: mecha.y + mecha.height / 2,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6 - 2,
            life: 20,
            maxLife: 20,
            color: '#ffd166',
            size: 2
        });
    }
}

function createDefendEffect(mecha) {
    for (let i = 0; i < 5; i++) {
        particles.push({
            x: mecha.x + mecha.width / 2,
            y: mecha.y + mecha.height / 2,
            vx: (Math.random() - 0.5) * 3,
            vy: (Math.random() - 0.5) * 3,
            life: 15,
            maxLife: 15,
            color: '#748ffc',
            size: 3
        });
    }
}

function createUltimateEffect(mecha) {
    for (let i = 0; i < 20; i++) {
        particles.push({
            x: mecha.x + mecha.width / 2,
            y: mecha.y + mecha.height / 2,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8,
            life: 30,
            maxLife: 30,
            color: mecha.type === 'flame' ? '#ff6b6b' : '#748ffc',
            size: 3
        });
    }
}

function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function drawPixelRect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(Math.floor(x) * SCALE, Math.floor(y) * SCALE, w * SCALE, h * SCALE);
}

function drawMecha(mecha) {
    if (!mecha) return;
    
    const template = mechas[mecha.type];
    const x = Math.floor(mecha.x);
    const y = Math.floor(mecha.y);
    
    if (mecha.invincible && Math.floor(Date.now() / 50) % 2 === 0) return;
    
    ctx.save();
    if (mecha.facing === 'left') {
        ctx.translate((x + mecha.width) * SCALE, 0);
        ctx.scale(-1, 1);
        ctx.translate(-x * SCALE, 0);
    }
    
    const bodyOffset = mecha.state === 'walk' ? Math.sin(mecha.animFrame * Math.PI / 2) * 2 : 0;
    
    drawPixelRect(x + 4, y + 8 + bodyOffset, 16, 20, template.color);
    drawPixelRect(x + 2, y + 12 + bodyOffset, 4, 12, template.color);
    drawPixelRect(x + 18, y + 12 + bodyOffset, 4, 12, template.color);
    
    drawPixelRect(x + 6, y + bodyOffset, 12, 10, template.secondaryColor);
    drawPixelRect(x + 7, y + 2 + bodyOffset, 4, 4, '#1a1a2e');
    drawPixelRect(x + 13, y + 2 + bodyOffset, 4, 4, '#1a1a2e');
    
    drawPixelRect(x + 4, y + 26 + bodyOffset, 6, 8, template.color);
    drawPixelRect(x + 14, y + 26 + bodyOffset, 6, 8, template.color);
    
    if (mecha.state === 'attack') {
        drawPixelRect(x + 22, y + 14, 8, 6, '#ffd166');
    }
    
    if (mecha.state === 'ultimate') {
        const glowSize = 4 + Math.sin(Date.now() / 50) * 2;
        ctx.globalAlpha = 0.5;
        drawPixelRect(x - glowSize, y - glowSize, mecha.width + glowSize * 2, mecha.height + glowSize * 2, template.color);
        ctx.globalAlpha = 1;
    }
    
    if (mecha.state === 'defend') {
        drawPixelRect(x + 20, y + 8, 6, 16, '#748ffc');
    }
    
    ctx.restore();
}

function drawBackground() {
    drawPixelRect(0, 0, LOGICAL_WIDTH, 150, colors.bg);
    
    for (let i = 0; i < LOGICAL_WIDTH; i += 20) {
        drawPixelRect(i, 145, 2, 5, '#2d2d44');
    }
    
    drawPixelRect(0, 150, LOGICAL_WIDTH, 30, colors.ground);
    
    for (let i = 0; i < LOGICAL_WIDTH; i += 16) {
        drawPixelRect(i, 150, 12, 4, '#5c5f77');
    }
    
    for (let i = 40; i < LOGICAL_WIDTH; i += 80) {
        drawPixelRect(i, 120, 2, 30, '#3d3d5c');
        drawPixelRect(i - 4, 118, 10, 4, '#3d3d5c');
    }
}

function drawParticles() {
    particles.forEach(p => {
        ctx.globalAlpha = p.life / p.maxLife;
        drawPixelRect(p.x, p.y, p.size, p.size, p.color);
    });
    ctx.globalAlpha = 1;
}

function drawHealthBars() {
    const barWidth = 100;
    const barHeight = 8;
    
    if (localMecha) {
        const x = 10;
        const y = 10;
        
        drawPixelRect(x, y, barWidth, barHeight, '#333');
        drawPixelRect(x + 1, y + 1, (barWidth - 2) * (localMecha.hp / localMecha.maxHp), barHeight - 2, colors.hpBar);
        
        drawPixelRect(x, y + 10, barWidth, 4, '#333');
        drawPixelRect(x + 1, y + 11, (barWidth - 2) * (localMecha.energy / localMecha.maxEnergy), 2, colors.energyBar);
        
        ctx.fillStyle = colors.text;
        ctx.font = `${8 * SCALE}px monospace`;
        ctx.fillText('P1', x * SCALE, (y - 2) * SCALE);
    }
    
    if (remoteMecha) {
        const x = LOGICAL_WIDTH - 110;
        const y = 10;
        
        drawPixelRect(x, y, barWidth, barHeight, '#333');
        drawPixelRect(x + 1, y + 1, (barWidth - 2) * (remoteMecha.hp / remoteMecha.maxHp), barHeight - 2, colors.hpBar);
        
        drawPixelRect(x, y + 10, barWidth, 4, '#333');
        drawPixelRect(x + 1, y + 11, (barWidth - 2) * (remoteMecha.energy / remoteMecha.maxEnergy), 2, colors.energyBar);
        
        ctx.fillStyle = colors.text;
        ctx.font = `${8 * SCALE}px monospace`;
        ctx.fillText('P2', x * SCALE, (y - 2) * SCALE);
    }
}

function drawBattle() {
    ctx.save();
    
    if (screenShake > 0) {
        ctx.translate(
            (Math.random() - 0.5) * screenShake * SCALE,
            (Math.random() - 0.5) * screenShake * SCALE
        );
        screenShake *= 0.9;
        if (screenShake < 0.5) screenShake = 0;
    }
    
    drawBackground();
    if (localMecha) drawMecha(localMecha);
    if (remoteMecha) drawMecha(remoteMecha);
    drawParticles();
    drawHealthBars();
    
    ctx.restore();
}

function drawSelectScreen() {
    drawBackground();
    
    ctx.fillStyle = colors.text;
    ctx.font = `${10 * SCALE}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('选择机甲', LOGICAL_WIDTH / 2 * SCALE, 30 * SCALE);
    
    ctx.fillStyle = localSelection ? colors.hpBar : colors.p1Color;
    ctx.font = `${6 * SCALE}px monospace`;
    ctx.fillText(localSelection ? '已选择' : '点击选择', 105 * SCALE, 75 * SCALE);
    drawMechaPreview('flame', 85, 85);
    
    ctx.fillStyle = remoteSelection ? colors.hpBar : colors.p2Color;
    ctx.fillText(remoteSelection ? '已选择' : (isPractice || isLocalPVP) ? 'AI/玩家2' : '等待对方...', 195 * SCALE, 75 * SCALE);
    drawMechaPreview('frost', 175, 85);
    
    ctx.fillStyle = '#888';
    ctx.font = `${5 * SCALE}px monospace`;
    ctx.fillText('近战·高伤害', 105 * SCALE, 132 * SCALE);
    ctx.fillText('远程·灵活', 195 * SCALE, 132 * SCALE);
    
    ctx.textAlign = 'left';
}

function drawMechaPreview(type, x, y) {
    const template = mechas[type];
    drawPixelRect(x, y, 40, 48, template.color);
    drawPixelRect(x + 10, y + 10, 20, 24, template.secondaryColor);
    drawPixelRect(x + 14, y + 14, 6, 6, '#1a1a2e');
    drawPixelRect(x + 22, y + 14, 6, 6, '#1a1a2e');
    drawPixelRect(x + 8, y + 32, 10, 12, template.color);
    drawPixelRect(x + 22, y + 32, 10, 12, template.color);
}

function drawResult(won) {
    drawBattle();
    
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, LOGICAL_WIDTH * SCALE, LOGICAL_HEIGHT * SCALE);
    
    ctx.fillStyle = won ? colors.accent : '#e63946';
    ctx.font = `${20 * SCALE}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText(won ? '🏆 胜利! 🏆' : '💀 失败', LOGICAL_WIDTH / 2 * SCALE, 70 * SCALE);
    
    ctx.fillStyle = colors.text;
    ctx.font = `${8 * SCALE}px monospace`;
    ctx.fillText('[ 再来一局 ]', 130 * SCALE, 143 * SCALE);
    ctx.fillText('[ 返回主菜单 ]', 210 * SCALE, 143 * SCALE);
    
    ctx.textAlign = 'left';
}

let lastTime = 0;
let aiActionTimer = 0;

function gameLoop(timestamp) {
    const dt = timestamp - lastTime;
    lastTime = timestamp;
    
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    if (gameState === 'select') {
        drawSelectScreen();
        if (localMecha) updateMecha(localMecha, dt);
        if (remoteMecha) updateMecha(remoteMecha, dt);
    } else if (gameState === 'battle') {
        if (localMecha) {
            if (isTouchDevice || isLocalPVP) {
                updateMechaFromInput(localMecha, p1Input, dt);
            }
            updateMecha(localMecha, dt);
        }
        
        if (remoteMecha) {
            if (isPractice) {
                updateAI(remoteMecha, dt);
            } else if (isLocalPVP) {
                updateMechaFromInput(remoteMecha, p2Input, dt);
            }
            updateMecha(remoteMecha, dt);
        }
        
        if (isOnline && isHost && remoteMecha) {
            if (Math.random() < 0.02) {
                conn.send({ type: 'sync', x: remoteMecha.x, state: remoteMecha.state });
            }
        }
        
        updateParticles(dt);
        drawBattle();
    } else if (gameState === 'result') {
        const won = localMecha && localMecha.hp > 0;
        drawResult(won);
    }
    
    requestAnimationFrame(gameLoop);
}

function updateAI(mecha, dt) {
    if (!mecha || !localMecha || mecha.attackTimer > 0) return;
    
    aiActionTimer += dt;
    
    const reactionTime = aiDifficulty === 'easy' ? 800 : 300;
    const aggression = aiDifficulty === 'easy' ? 0.4 : 0.8;
    
    if (aiActionTimer < reactionTime) return;
    aiActionTimer = 0;
    
    const dx = localMecha.x - mecha.x;
    const distance = Math.abs(dx);
    
    mecha.facing = dx > 0 ? 'right' : 'left';
    
    if (distance > 60) {
        mecha.x += (dx > 0 ? 1 : -1) * mecha.speed * (aiDifficulty === 'easy' ? 0.6 : 1);
        mecha.x = Math.max(10, Math.min(LOGICAL_WIDTH - 34, mecha.x));
        if (mecha.state !== 'attack' && mecha.state !== 'ultimate') mecha.state = 'walk';
    }
    
    if (distance <= 80 && Math.random() < aggression) {
        if (mecha.energy >= 100 && Math.random() < 0.3) {
            performUltimate(mecha);
        } else {
            performAttack(mecha);
        }
    }
    
    if (localMecha.state === 'attack' || localMecha.state === 'ultimate') {
        if (distance < 60 && Math.random() < (aiDifficulty === 'easy' ? 0.2 : 0.6)) {
            mecha.state = 'defend';
        }
    }
}

function selectMecha(type) {
    if (gameState !== 'select') return;
    if (isOnline && !isHost) return;
    
    localSelection = type;
    
    if (isOnline && conn) {
        conn.send({ type: 'select', mecha: type });
    }
    
    startBattle();
}

function startBattle() {
    gameState = 'battle';
    
    const localType = localSelection || 'flame';
    const remoteType = remoteSelection || 'frost';
    
    localMecha = createMecha(localType, true, 50);
    remoteMecha = createMecha(remoteType, false, 250);
    
    particles = [];
    screenShake = 0;
    aiActionTimer = aiDifficulty === 'easy' ? 500 : 200;
}

function endBattle(localWon) {
    if (gameState !== 'battle') return;
    gameState = 'result';
    
    if (isOnline && localMecha && conn) {
        conn.send({ type: 'end', won: localMecha.hp > 0 });
    }
}

function restartGame() {
    gameState = 'select';
    localMecha = null;
    remoteMecha = null;
    localSelection = null;
    remoteSelection = null;
    particles = [];
    
    if (isOnline) {
        showConnectionOverlay();
    } else if (isPractice || isLocalPVP) {
        hideOverlay();
        if (isPractice) {
            remoteSelection = 'frost';
            remoteMecha = createMecha('frost', false, 250);
        }
    }
}

function returnToMenu() {
    cleanup();
    showConnectionOverlay();
}

function cleanup() {
    gameState = 'menu';
    localMecha = null;
    remoteMecha = null;
    localSelection = null;
    remoteSelection = null;
    particles = [];
    isOnline = false;
    isLocalPVP = false;
    isPractice = false;
    aiDifficulty = 'easy';
    
    p1Input = { direction: { x: 0, y: 0 }, attack: false, defend: false, ultimate: false, attackPressed: false, defendPressed: false, ultimatePressed: false };
    p2Input = { direction: { x: 0, y: 0 }, attack: false, defend: false, ultimate: false, attackPressed: false, defendPressed: false, ultimatePressed: false };
    
    if (conn) { conn.close(); conn = null; }
    if (peer) { peer.destroy(); peer = null; }
}

function hideOverlay() {
    document.getElementById('connectionOverlay').classList.add('hidden');
}

function showConnectionOverlay() {
    const overlay = document.getElementById('connectionOverlay');
    overlay.classList.remove('hidden');
    returnToMain();
}

function returnToMain() {
    hideAllSections();
    document.getElementById('menuSection').classList.remove('hidden');
}

function showPracticeMenu() {
    hideAllSections();
    document.getElementById('practiceSection').classList.remove('hidden');
}

function showLocalPVP() {
    hideAllSections();
    hideOverlay();
    isLocalPVP = true;
    isPractice = false;
    isOnline = false;
    remoteSelection = 'frost';
    remoteMecha = createMecha('frost', false, 250);
    gameState = 'select';
}

function showMultiplayerMenu() {
    hideAllSections();
    document.getElementById('multiplayerSection').classList.remove('hidden');
}

function hideAllSections() {
    const sections = ['menuSection', 'practiceSection', 'multiplayerSection', 'createRoomSection', 'joinRoomSection'];
    sections.forEach(id => document.getElementById(id).classList.add('hidden'));
}

function startPractice(difficulty) {
    aiDifficulty = difficulty;
    isPractice = true;
    isOnline = false;
    isLocalPVP = false;
    remoteSelection = 'frost';
    remoteMecha = createMecha('frost', false, 250);
    hideOverlay();
    gameState = 'select';
}

function generateRoomCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = '';
    for (let i = 0; i < 6; i++) {
        code += chars[Math.floor(Math.random() * chars.length)];
    }
    return code;
}

function createRoom() {
    const roomCode = generateRoomCode();
    hideAllSections();
    document.getElementById('createRoomSection').classList.remove('hidden');
    document.getElementById('roomCodeDisplay').textContent = roomCode;
    document.getElementById('waitingStatus').textContent = '正在初始化连接...';
    document.getElementById('waitingStatus').classList.remove('error');
    
    isHost = true;
    isOnline = true;
    isPractice = false;
    isLocalPVP = false;
    
    peer = new Peer('MECHA-' + roomCode, { debug: 0 });
    
    peer.on('open', () => {
        myPlayerId = peer.id;
        document.getElementById('waitingStatus').textContent = '等待玩家加入...\n分享房间码: ' + roomCode;
    });
    
    peer.on('connection', (connection) => {
        conn = connection;
        setupConnection();
        document.getElementById('waitingStatus').textContent = '玩家已连接!';
        hideOverlay();
        remoteSelection = 'frost';
        remoteMecha = createMecha('frost', false, 250);
        gameState = 'select';
    });
    
    peer.on('error', (err) => {
        document.getElementById('waitingStatus').textContent = '错误: ' + err.type;
        document.getElementById('waitingStatus').classList.add('error');
    });
}

function showJoinRoom() {
    hideAllSections();
    document.getElementById('joinRoomSection').classList.remove('hidden');
    document.getElementById('joinStatus').textContent = '';
    document.getElementById('joinStatus').classList.remove('error');
}

function cancelJoin() {
    if (peer) { peer.destroy(); peer = null; }
    showMultiplayerMenu();
}

function joinRoom() {
    const roomCode = document.getElementById('roomCodeInput').value.trim().toUpperCase();
    
    if (!roomCode) {
        document.getElementById('joinStatus').textContent = '请输入房间码';
        document.getElementById('joinStatus').classList.add('error');
        return;
    }
    
    document.getElementById('joinStatus').textContent = '正在连接...';
    document.getElementById('joinStatus').classList.remove('error');
    
    isHost = false;
    isOnline = true;
    isPractice = false;
    isLocalPVP = false;
    
    peer = new Peer({ debug: 0 });
    
    peer.on('open', () => {
        conn = peer.connect('MECHA-' + roomCode, { reliable: true });
        
        conn.on('open', () => {
            setupConnection();
            document.getElementById('joinStatus').textContent = '连接成功!';
            setTimeout(() => {
                hideOverlay();
                remoteSelection = 'flame';
                remoteMecha = createMecha('flame', false, 250);
                gameState = 'select';
            }, 500);
        });
        
        conn.on('error', (err) => {
            document.getElementById('joinStatus').textContent = '连接失败';
            document.getElementById('joinStatus').classList.add('error');
        });
    });
    
    peer.on('error', (err) => {
        document.getElementById('joinStatus').textContent = '错误: ' + err.type;
        document.getElementById('joinStatus').classList.add('error');
    });
}

function setupConnection() {
    conn.on('data', handleNetworkData);
    
    conn.on('close', () => {
        if (gameState === 'battle') {
            alert('对手断开连接');
            cleanup();
            showConnectionOverlay();
        }
    });
}

function handleNetworkData(data) {
    if (data.type === 'ready') {
        remoteSelection = 'frost';
        if (isHost && localSelection) startBattle();
    }
    else if (data.type === 'select') {
        remoteSelection = data.mecha;
        if (localSelection) startBattle();
    }
    else if (data.type === 'damage') {
        if (remoteMecha) {
            remoteMecha.hp = data.targetHp;
            if (remoteMecha.hp <= 0) endBattle(true);
        }
    }
    else if (data.type === 'sync') {
        if (remoteMecha) {
            remoteMecha.x = data.x;
            remoteMecha.state = data.state;
        }
    }
    else if (data.type === 'end') {
        if (data.won) {
            if (localMecha) localMecha.hp = 0;
            endBattle(false);
        }
    }
}

function cancelRoom() {
    if (conn) { conn.close(); conn = null; }
    if (peer) { peer.destroy(); peer = null; }
    isOnline = false;
    showMultiplayerMenu();
}

function initTouchControls() {
    const joystick = document.getElementById('joystick');
    const knob = document.getElementById('joystickKnob');
    let joystickTouchId = null;
    
    function updateJoystick(touch) {
        const rect = joystick.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        
        let dx = touch.clientX - centerX;
        let dy = touch.clientY - centerY;
        
        const maxDist = rect.width / 2 - 10;
        const dist = Math.sqrt(dx * dx + dy * dy);
        
        if (dist > maxDist) {
            dx = dx / dist * maxDist;
            dy = dy / dist * maxDist;
        }
        
        knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        p1Input.direction.x = dx / maxDist;
        p1Input.direction.y = dy / maxDist;
    }
    
    joystick.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (joystickTouchId === null) {
            joystickTouchId = e.changedTouches[0].identifier;
            updateJoystick(e.changedTouches[0]);
        }
    }, { passive: false });
    
    joystick.addEventListener('touchmove', (e) => {
        e.preventDefault();
        for (let touch of e.changedTouches) {
            if (touch.identifier === joystickTouchId) updateJoystick(touch);
        }
    }, { passive: false });
    
    joystick.addEventListener('touchend', (e) => {
        e.preventDefault();
        for (let touch of e.changedTouches) {
            if (touch.identifier === joystickTouchId) {
                joystickTouchId = null;
                knob.style.transform = 'translate(-50%, -50%)';
                p1Input.direction.x = 0;
                p1Input.direction.y = 0;
            }
        }
    }, { passive: false });
    
    function addButtonListener(btnId, inputKey) {
        const btn = document.getElementById(btnId);
        btn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            p1Input[inputKey] = true;
            btn.classList.add('pressed');
        }, { passive: false });
        btn.addEventListener('touchend', (e) => {
            e.preventDefault();
            p1Input[inputKey] = false;
            btn.classList.remove('pressed');
        }, { passive: false });
        btn.addEventListener('touchcancel', (e) => {
            e.preventDefault();
            p1Input[inputKey] = false;
            btn.classList.remove('pressed');
        }, { passive: false });
    }
    
    addButtonListener('attackBtn', 'attack');
    addButtonListener('defendBtn', 'defend');
    addButtonListener('ultimateBtn', 'ultimate');
}

function initKeyboardControls() {
    document.addEventListener('keydown', (e) => {
        if (keys[e.code]) return;
        keys[e.code] = true;
        
        if (e.code === 'KeyW') p1Input.direction.y = -1;
        if (e.code === 'KeyS') p1Input.direction.y = 1;
        if (e.code === 'KeyA') p1Input.direction.x = -1;
        if (e.code === 'KeyD') p1Input.direction.x = 1;
        
        if (e.code === 'KeyJ') p1Input.attack = true;
        if (e.code === 'KeyK') p1Input.defend = true;
        if (e.code === 'KeyU') p1Input.ultimate = true;
        
        if (isLocalPVP || e.shiftKey) {
            if (e.code === 'ArrowUp') p2Input.direction.y = -1;
            if (e.code === 'ArrowDown') p2Input.direction.y = 1;
            if (e.code === 'ArrowLeft') p2Input.direction.x = -1;
            if (e.code === 'ArrowRight') p2Input.direction.x = 1;
            
            if (e.code === 'Numpad1' || e.code === 'Digit1') p2Input.attack = true;
            if (e.code === 'Numpad2' || e.code === 'Digit2') p2Input.defend = true;
            if (e.code === 'Numpad3' || e.code === 'Digit3') p2Input.ultimate = true;
        }
    });
    
    document.addEventListener('keyup', (e) => {
        keys[e.code] = false;
        
        if (e.code === 'KeyW' && p1Input.direction.y < 0) p1Input.direction.y = 0;
        if (e.code === 'KeyS' && p1Input.direction.y > 0) p1Input.direction.y = 0;
        if (e.code === 'KeyA' && p1Input.direction.x < 0) p1Input.direction.x = 0;
        if (e.code === 'KeyD' && p1Input.direction.x > 0) p1Input.direction.x = 0;
        
        if (e.code === 'KeyJ') p1Input.attack = false;
        if (e.code === 'KeyK') p1Input.defend = false;
        if (e.code === 'KeyU') p1Input.ultimate = false;
        
        if (isLocalPVP || keys['ShiftLeft'] || keys['ShiftRight']) {
            if (e.code === 'ArrowUp') p2Input.direction.y = 0;
            if (e.code === 'ArrowDown') p2Input.direction.y = 0;
            if (e.code === 'ArrowLeft') p2Input.direction.x = 0;
            if (e.code === 'ArrowRight') p2Input.direction.x = 0;
            
            if (e.code === 'Numpad1' || e.code === 'Digit1') p2Input.attack = false;
            if (e.code === 'Numpad2' || e.code === 'Digit2') p2Input.defend = false;
            if (e.code === 'Numpad3' || e.code === 'Digit3') p2Input.ultimate = false;
        }
    });
}

function updateTouchUI() {
    const touchControls = document.querySelectorAll('.touchControl');
    touchControls.forEach(el => {
        if (isTouchDevice && gameState === 'battle') {
            el.classList.add('active');
        } else {
            el.classList.remove('active');
        }
    });
}

window.addEventListener('resize', initCanvas);

window.addEventListener('load', () => {
    isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    
    initCanvas();
    initTouchControls();
    initKeyboardControls();
    showConnectionOverlay();
    requestAnimationFrame(gameLoop);
});

document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        p1Input.direction = { x: 0, y: 0 };
        p1Input.attack = false;
        p1Input.defend = false;
        p1Input.ultimate = false;
        p2Input.direction = { x: 0, y: 0 };
        p2Input.attack = false;
        p2Input.defend = false;
        p2Input.ultimate = false;
    }
});

setInterval(updateTouchUI, 100);
</script>
