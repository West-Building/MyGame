<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>像素风机甲对战</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
            font-family: monospace;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #gameCanvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background: #1a1a2e;
        }
        .touchControl {
            position: absolute;
            pointer-events: none;
        }
        #joystickArea {
            left: 0;
            bottom: 0;
            width: 40%;
            height: 50%;
        }
        #buttonArea {
            right: 0;
            bottom: 0;
            width: 40%;
            height: 50%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 10px;
            gap: 10px;
        }
        .joystick {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            border: 3px solid rgba(255,255,255,0.3);
            pointer-events: auto;
            touch-action: none;
        }
        .joystickKnob {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255,255,255,0.4);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        .skillButton {
            pointer-events: auto;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px black;
            border: 3px solid rgba(255,255,255,0.5);
            transition: transform 0.1s;
        }
        .skillButton:active {
            transform: scale(0.9);
        }
        #attackBtn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(230, 57, 70, 0.6);
        }
        #defendBtn {
            width: 55px;
            height: 55px;
            border-radius: 8px;
            background: rgba(67, 97, 238, 0.6);
        }
        #ultimateBtn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: rgba(244, 162, 97, 0.6);
            animation: ultimatePulse 0.8s infinite;
        }
        @keyframes ultimatePulse {
            0%, 100% { box-shadow: 0 0 10px rgba(255,209,102,0.5); }
            50% { box-shadow: 0 0 25px rgba(255,209,102,0.9); }
        }
        .buttonRow {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        #connectionOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 26, 46, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #f1faee;
            padding: 20px;
            text-align: center;
        }
        .hidden { display: none !important; }
        .btn {
            padding: 15px 30px;
            font-size: 18px;
            font-family: monospace;
            background: #4361ee;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            min-width: 200px;
        }
        .btn:hover { background: #3a56d4; }
        .btn:active { transform: scale(0.95); }
        .btn.red { background: #e63946; }
        .btn.red:hover { background: #d62839; }
        .btn.green { background: #2ec4b6; }
        .btn.green:hover { background: #25a89d; }
        .roomInfo {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            word-break: break-all;
        }
        .roomCode {
            font-size: 24px;
            color: #ffd166;
            margin: 10px 0;
            letter-spacing: 2px;
        }
        input {
            padding: 15px;
            font-size: 16px;
            font-family: monospace;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            color: white;
            width: 250px;
            text-align: center;
        }
        input::placeholder { color: rgba(255,255,255,0.5); }
        .status { color: #f4a261; margin: 10px 0; }
        .error { color: #e63946; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="joystickArea" class="touchControl">
            <div id="joystick" class="joystick">
                <div id="joystickKnob" class="joystickKnob"></div>
            </div>
        </div>
        
        <div id="buttonArea" class="touchControl">
            <div class="buttonRow">
                <div id="defendBtn" class="skillButton">防</div>
            </div>
            <div class="buttonRow">
                <div id="attackBtn" class="skillButton">攻</div>
                <div id="ultimateBtn" class="skillButton">大</div>
            </div>
        </div>
    </div>

    <div id="connectionOverlay">
        <h1 style="font-size: 28px; margin-bottom: 10px;">⚔️ 像素风机甲对战 ⚔️</h1>
        <p style="color: #aaa; margin-bottom: 30px;">局域网联机 | 移动端适配</p>
        
        <div id="menuSection">
            <button class="btn" onclick="startPractice()">🎮 单人练习</button>
            <button class="btn" onclick="showMultiplayerMenu()">📡 局域网对战</button>
        </div>
        
        <div id="multiplayerSection" class="hidden">
            <button class="btn" onclick="createRoom()">🏠 创建房间</button>
            <button class="btn" onclick="showJoinRoom()">🔍 加入房间</button>
            <button class="btn green" onclick="showMenu()">← 返回</button>
        </div>
        
        <div id="createRoomSection" class="hidden">
            <h2>房间已创建</h2>
            <p>分享房间码给好友：</p>
            <div class="roomInfo">
                <div class="roomCode" id="roomCodeDisplay">等待生成...</div>
                <p style="font-size: 12px; color: #aaa;">等待对方加入...</p>
            </div>
            <div class="status" id="waitingStatus"></div>
            <button class="btn red" onclick="cancelRoom()">取消</button>
        </div>
        
        <div id="joinRoomSection" class="hidden">
            <h2>加入房间</h2>
            <p>输入好友的房间码：</p>
            <input type="text" id="roomCodeInput" placeholder="输入房间码...">
            <button class="btn green" onclick="joinRoom()">连接</button>
            <div class="status" id="joinStatus"></div>
            <button class="btn red" onclick="showMultiplayerMenu()">取消</button>
        </div>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const LOGICAL_WIDTH = 320;
const LOGICAL_HEIGHT = 180;
let SCALE = 3;

let gameState = 'menu';
let isOnline = false;
let isHost = false;
let peer = null;
let conn = null;
let myPlayerId = null;

const colors = {
    bg: '#1a1a2e',
    ground: '#4a4e69',
    p1Color: '#e63946',
    p2Color: '#4361ee',
    hpBar: '#2ec4b6',
    energyBar: '#f4a261',
    text: '#f1faee',
    accent: '#ffd166'
};

const mechas = {
    flame: {
        name: '烈焰',
        color: '#e63946',
        secondaryColor: '#ff6b6b',
        attackType: 'melee',
        damage: 15,
        ultimateDamage: 35,
        speed: 2
    },
    frost: {
        name: '寒霜',
        color: '#4361ee',
        secondaryColor: '#748ffc',
        attackType: 'range',
        damage: 12,
        ultimateDamage: 30,
        speed: 2.5
    }
};

let localMecha = null;
let remoteMecha = null;
let localSelection = null;
let remoteSelection = null;

let particles = [];
let screenShake = 0;
let battleStartTime = 0;

const input = {
    direction: { x: 0, y: 0 },
    attack: false,
    defend: false,
    ultimate: false,
    attackPressed: false,
    defendPressed: false,
    ultimatePressed: false
};

const keys = {};

let joystick = null;
let joystickTouchId = null;
let joystickBase = { x: 0, y: 0 };

function initCanvas() {
    const container = document.getElementById('gameContainer');
    const aspectRatio = LOGICAL_WIDTH / LOGICAL_HEIGHT;
    
    let width = container.clientWidth;
    let height = container.clientHeight;
    
    if (width / height > aspectRatio) {
        width = height * aspectRatio;
    } else {
        height = width / aspectRatio;
    }
    
    SCALE = Math.floor(width / LOGICAL_WIDTH);
    SCALE = Math.max(2, SCALE);
    
    canvas.width = LOGICAL_WIDTH * SCALE;
    canvas.height = LOGICAL_HEIGHT * SCALE;
    canvas.style.width = canvas.width + 'px';
    canvas.style.height = canvas.height + 'px';
    
    ctx.imageSmoothingEnabled = false;
    
    canvas.addEventListener('click', handleClick);
}

function handleClick(e) {
    if (gameState === 'menu') {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) / SCALE;
        const y = (e.clientY - rect.top) / SCALE;
        
        if (y > 100 && y < 130) {
            if (x > 80 && x < 160) {
                startPractice();
            }
        }
    } else if (gameState === 'select') {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) / SCALE;
        const y = (e.clientY - rect.top) / SCALE;
        
        if (y > 80 && y < 130) {
            if (x > 60 && x < 150) {
                selectMecha('flame');
            } else if (x > 170 && x < 260) {
                selectMecha('frost');
            }
        }
    } else if (gameState === 'result') {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) / SCALE;
        const y = (e.clientY - rect.top) / SCALE;
        
        if (y > 130 && y < 155) {
            if (x > 100 && x < 160) {
                restartGame();
            } else if (x > 170 && x < 250) {
                returnToMenu();
            }
        }
    }
}

function createMecha(type, isLocal, x) {
    const template = mechas[type];
    return {
        type: type,
        x: x,
        y: 130,
        width: 24,
        height: 32,
        hp: 100,
        maxHp: 100,
        energy: 100,
        maxEnergy: 100,
        speed: template.speed,
        facing: isLocal ? 'right' : 'left',
        state: 'idle',
        animFrame: 0,
        animTimer: 0,
        attackTimer: 0,
        hitTimer: 0,
        invincible: false,
        invincibleTimer: 0,
        isLocal: isLocal
    };
}

function updateMecha(mecha, dt) {
    if (!mecha) return;
    
    if (mecha.attackTimer > 0) mecha.attackTimer -= dt;
    if (mecha.hitTimer > 0) mecha.hitTimer -= dt;
    
    if (mecha.invincibleTimer > 0) {
        mecha.invincibleTimer -= dt;
        mecha.invincible = true;
    } else {
        mecha.invincible = false;
    }
    
    if (mecha.state === 'hit') {
        if (mecha.hitTimer <= 0) {
            mecha.state = 'idle';
        }
    }
    
    if (mecha.state === 'attack' || mecha.state === 'ultimate') {
        if (mecha.attackTimer <= 0) {
            mecha.state = 'idle';
        }
    }
    
    mecha.animTimer += dt;
    if (mecha.animTimer > 150) {
        mecha.animTimer = 0;
        mecha.animFrame = (mecha.animFrame + 1) % 4;
    }
}

function updateMechaFromInput(mecha, dt) {
    if (!mecha || !mecha.isLocal) return;
    
    const dir = input.direction;
    let moving = false;
    
    if (dir.x !== 0 || dir.y !== 0) {
        let moveX = dir.x * mecha.speed;
        
        mecha.x += moveX;
        mecha.x = Math.max(10, Math.min(LOGICAL_WIDTH - 34, mecha.x));
        
        if (dir.x > 0) mecha.facing = 'right';
        else if (dir.x < 0) mecha.facing = 'left';
        
        if (mecha.state !== 'attack' && mecha.state !== 'ultimate') {
            mecha.state = 'walk';
        }
        moving = true;
    }
    
    if (!moving && mecha.state === 'walk') {
        mecha.state = 'idle';
    }
    
    if (input.attack && !input.attackPressed && mecha.attackTimer <= 0) {
        performAttack(mecha);
        input.attackPressed = true;
    }
    if (!input.attack) input.attackPressed = false;
    
    if (input.ultimate && !input.ultimatePressed && mecha.energy >= 100 && mecha.attackTimer <= 0) {
        performUltimate(mecha);
        input.ultimatePressed = true;
    }
    if (!input.ultimate) input.ultimatePressed = false;
    
    if (input.defend && mecha.state !== 'attack' && mecha.state !== 'ultimate') {
        mecha.state = 'defend';
    } else if (mecha.state === 'defend' && !input.defend) {
        mecha.state = 'idle';
    }
    
    mecha.energy = Math.min(mecha.maxEnergy, mecha.energy + 2 * dt / 1000);
}

function performAttack(mecha) {
    mecha.state = 'attack';
    mecha.attackTimer = 300;
    
    if (isOnline && mecha.isLocal && conn) {
        conn.send({ type: 'attack', mechaType: mecha.type, x: mecha.x, facing: mecha.facing, timestamp: Date.now() });
    }
    
    if (isOnline && !mecha.isLocal) {
        return;
    }
    
    checkAttackHit(mecha);
}

function performUltimate(mecha) {
    mecha.state = 'ultimate';
    mecha.attackTimer = 500;
    mecha.energy = 0;
    screenShake = 15;
    
    createUltimateEffect(mecha);
    
    if (isOnline && mecha.isLocal && conn) {
        conn.send({ type: 'ultimate', mechaType: mecha.type, x: mecha.x, facing: mecha.facing, timestamp: Date.now() });
    }
    
    if (isOnline && !mecha.isLocal) {
        return;
    }
    
    checkUltimateHit(mecha);
}

function checkAttackHit(attacker) {
    const target = attacker.isLocal ? remoteMecha : localMecha;
    if (!target) return;
    
    const template = mechas[attacker.type];
    const range = template.attackType === 'melee' ? 40 : 80;
    
    let dx = target.x - attacker.x;
    if (attacker.facing === 'left') dx = attacker.x - target.x;
    
    if (dx > 0 && dx < range && Math.abs(target.y - attacker.y) < 20) {
        let damage = template.damage;
        if (target.state === 'defend') {
            damage = Math.floor(damage * 0.3);
            createDefendEffect(target);
        }
        
        applyDamage(target, damage, attacker);
    }
}

function checkUltimateHit(attacker) {
    const target = attacker.isLocal ? remoteMecha : localMecha;
    if (!target) return;
    
    const range = 100;
    
    let dx = target.x - attacker.x;
    if (attacker.facing === 'left') dx = attacker.x - target.x;
    
    if (dx > 0 && dx < range && Math.abs(target.y - attacker.y) < 30) {
        let damage = mechas[attacker.type].ultimateDamage;
        if (target.state === 'defend') {
            damage = Math.floor(damage * 0.3);
            createDefendEffect(target);
        }
        
        applyDamage(target, damage, attacker);
    }
}

function applyDamage(target, damage, attacker) {
    if (target.invincible) return;
    
    target.hp = Math.max(0, target.hp - damage);
    target.state = 'hit';
    target.hitTimer = 200;
    target.invincibleTimer = 300;
    
    const knockback = attacker.facing === 'right' ? -8 : 8;
    target.x += knockback;
    target.x = Math.max(10, Math.min(LOGICAL_WIDTH - 34, target.x));
    
    createHitEffect(target);
    
    if (isOnline && attacker.isLocal && conn) {
        conn.send({ type: 'damage', targetHp: target.hp, timestamp: Date.now() });
    }
    
    if (target.hp <= 0) {
        endBattle(attacker.isLocal);
    }
}

function createHitEffect(mecha) {
    for (let i = 0; i < 8; i++) {
        particles.push({
            x: mecha.x + mecha.width / 2,
            y: mecha.y + mecha.height / 2,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6 - 2,
            life: 20,
            maxLife: 20,
            color: '#ffd166',
            size: 2
        });
    }
}

function createDefendEffect(mecha) {
    for (let i = 0; i < 5; i++) {
        particles.push({
            x: mecha.x + mecha.width / 2,
            y: mecha.y + mecha.height / 2,
            vx: (Math.random() - 0.5) * 3,
            vy: (Math.random() - 0.5) * 3,
            life: 15,
            maxLife: 15,
            color: '#4361ee',
            size: 3
        });
    }
}

function createUltimateEffect(mecha) {
    for (let i = 0; i < 20; i++) {
        particles.push({
            x: mecha.x + mecha.width / 2,
            y: mecha.y + mecha.height / 2,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8,
            life: 30,
            maxLife: 30,
            color: mecha.type === 'flame' ? '#ff6b6b' : '#748ffc',
            size: 3
        });
    }
}

function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15;
        p.life--;
        
        if (p.life <= 0) {
            particles.splice(i, 1);
        }
    }
}

function drawPixelRect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(Math.floor(x) * SCALE, Math.floor(y) * SCALE, w * SCALE, h * SCALE);
}

function drawMecha(mecha) {
    if (!mecha) return;
    
    const template = mechas[mecha.type];
    const x = Math.floor(mecha.x);
    const y = Math.floor(mecha.y);
    
    if (mecha.invincible && Math.floor(Date.now() / 50) % 2 === 0) {
        return;
    }
    
    ctx.save();
    if (mecha.facing === 'left') {
        ctx.translate((x + mecha.width) * SCALE, 0);
        ctx.scale(-1, 1);
        ctx.translate(-x * SCALE, 0);
    }
    
    const bodyOffset = mecha.state === 'walk' ? Math.sin(mecha.animFrame * Math.PI / 2) * 2 : 0;
    
    drawPixelRect(x + 4, y + 8 + bodyOffset, 16, 20, template.color);
    drawPixelRect(x + 2, y + 12 + bodyOffset, 4, 12, template.color);
    drawPixelRect(x + 18, y + 12 + bodyOffset, 4, 12, template.color);
    
    drawPixelRect(x + 6, y + bodyOffset, 12, 10, template.secondaryColor);
    drawPixelRect(x + 7, y + 2 + bodyOffset, 4, 4, '#1a1a2e');
    drawPixelRect(x + 13, y + 2 + bodyOffset, 4, 4, '#1a1a2e');
    
    drawPixelRect(x + 4, y + 26 + bodyOffset, 6, 8, template.color);
    drawPixelRect(x + 14, y + 26 + bodyOffset, 6, 8, template.color);
    
    if (mecha.state === 'attack') {
        drawPixelRect(x + 22, y + 14, 8, 6, template.accent || '#ffd166');
    }
    
    if (mecha.state === 'ultimate') {
        const glowSize = 4 + Math.sin(Date.now() / 50) * 2;
        ctx.globalAlpha = 0.5;
        drawPixelRect(x - glowSize, y - glowSize, mecha.width + glowSize * 2, mecha.height + glowSize * 2, template.color);
        ctx.globalAlpha = 1;
    }
    
    if (mecha.state === 'defend') {
        drawPixelRect(x + 20, y + 8, 6, 16, '#748ffc');
    }
    
    ctx.restore();
}

function drawBackground() {
    drawPixelRect(0, 0, LOGICAL_WIDTH, 150, colors.bg);
    
    for (let i = 0; i < LOGICAL_WIDTH; i += 20) {
        drawPixelRect(i, 145, 2, 5, '#2d2d44');
    }
    
    drawPixelRect(0, 150, LOGICAL_WIDTH, 30, colors.ground);
    
    for (let i = 0; i < LOGICAL_WIDTH; i += 16) {
        drawPixelRect(i, 150, 12, 4, '#5c5f77');
    }
    
    for (let i = 40; i < LOGICAL_WIDTH; i += 80) {
        drawPixelRect(i, 120, 2, 30, '#3d3d5c');
        drawPixelRect(i - 4, 118, 10, 4, '#3d3d5c');
    }
}

function drawParticles() {
    particles.forEach(p => {
        ctx.globalAlpha = p.life / p.maxLife;
        drawPixelRect(p.x, p.y, p.size, p.size, p.color);
    });
    ctx.globalAlpha = 1;
}

function drawHealthBars() {
    const barWidth = 100;
    const barHeight = 8;
    
    if (localMecha) {
        const x = 10;
        const y = 10;
        
        drawPixelRect(x, y, barWidth, barHeight, '#333');
        drawPixelRect(x + 1, y + 1, (barWidth - 2) * (localMecha.hp / localMecha.maxHp), barHeight - 2, colors.hpBar);
        
        drawPixelRect(x, y + 10, barWidth, 4, '#333');
        drawPixelRect(x + 1, y + 11, (barWidth - 2) * (localMecha.energy / localMecha.maxEnergy), 2, colors.energyBar);
        
        ctx.fillStyle = colors.text;
        ctx.font = `${8 * SCALE}px monospace`;
        ctx.fillText('P1', x * SCALE, (y - 2) * SCALE);
    }
    
    if (remoteMecha) {
        const x = LOGICAL_WIDTH - 110;
        const y = 10;
        
        drawPixelRect(x, y, barWidth, barHeight, '#333');
        drawPixelRect(x + 1, y + 1, (barWidth - 2) * (remoteMecha.hp / remoteMecha.maxHp), barHeight - 2, colors.hpBar);
        
        drawPixelRect(x, y + 10, barWidth, 4, '#333');
        drawPixelRect(x + 1, y + 11, (barWidth - 2) * (remoteMecha.energy / remoteMecha.maxEnergy), 2, colors.energyBar);
        
        ctx.fillStyle = colors.text;
        ctx.font = `${8 * SCALE}px monospace`;
        ctx.fillText('P2', x * SCALE, (y - 2) * SCALE);
    }
}

function drawMenu() {
    drawBackground();
    
    ctx.fillStyle = colors.accent;
    ctx.font = `${16 * SCALE}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('⚔️ 机甲对战 ⚔️', LOGICAL_WIDTH / 2 * SCALE, 50 * SCALE);
    
    ctx.fillStyle = colors.text;
    ctx.font = `${6 * SCALE}px monospace`;
    ctx.fillText('像素风格', LOGICAL_WIDTH / 2 * SCALE, 65 * SCALE);
    
    ctx.fillStyle = colors.p1Color;
    ctx.font = `${8 * SCALE}px monospace`;
    ctx.fillText('[ 单人练习 ]', 120 * SCALE, 115 * SCALE);
    
    ctx.fillStyle = colors.p2Color;
    ctx.fillText('[ 局域网对战 ]', 200 * SCALE, 115 * SCALE);
    
    ctx.fillStyle = '#666';
    ctx.font = `${5 * SCALE}px monospace`;
    ctx.fillText('移动端：左侧摇杆移动，右侧按钮攻击', LOGICAL_WIDTH / 2 * SCALE, 165 * SCALE);
    ctx.fillText('键盘：WASD移动，J攻击，K防御，U大招', LOGICAL_WIDTH / 2 * SCALE, 172 * SCALE);
    
    ctx.textAlign = 'left';
}

function drawSelectScreen() {
    drawBackground();
    
    ctx.fillStyle = colors.text;
    ctx.font = `${10 * SCALE}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('选择机甲', LOGICAL_WIDTH / 2 * SCALE, 30 * SCALE);
    
    ctx.fillStyle = localSelection ? colors.hpBar : colors.p1Color;
    ctx.font = `${6 * SCALE}px monospace`;
    ctx.fillText(localSelection ? '已选择' : '点击选择', 105 * SCALE, 75 * SCALE);
    drawMechaPreview('flame', 85, 85);
    
    ctx.fillStyle = remoteSelection ? colors.hpBar : colors.p2Color;
    ctx.fillText(remoteSelection ? '已选择' : '等待对方...', 195 * SCALE, 75 * SCALE);
    drawMechaPreview('frost', 175, 85);
    
    ctx.fillStyle = '#888';
    ctx.font = `${5 * SCALE}px monospace`;
    ctx.fillText('近战·高伤害', 105 * SCALE, 130 * SCALE);
    ctx.fillText('远程·灵活', 195 * SCALE, 130 * SCALE);
    
    if (isOnline && !isHost) {
        ctx.fillStyle = colors.energyBar;
        ctx.fillText('等待房主选择...', LOGICAL_WIDTH / 2 * SCALE, 145 * SCALE);
    }
    
    ctx.textAlign = 'left';
}

function drawMechaPreview(type, x, y) {
    const template = mechas[type];
    
    drawPixelRect(x, y, 40, 48, template.color);
    drawPixelRect(x + 10, y + 10, 20, 24, template.secondaryColor);
    drawPixelRect(x + 14, y + 14, 6, 6, '#1a1a2e');
    drawPixelRect(x + 22, y + 14, 6, 6, '#1a1a2e');
    drawPixelRect(x + 8, y + 32, 10, 12, template.color);
    drawPixelRect(x + 22, y + 32, 10, 12, template.color);
}

function drawBattle() {
    ctx.save();
    
    if (screenShake > 0) {
        ctx.translate(
            (Math.random() - 0.5) * screenShake * SCALE,
            (Math.random() - 0.5) * screenShake * SCALE
        );
        screenShake *= 0.9;
        if (screenShake < 0.5) screenShake = 0;
    }
    
    drawBackground();
    
    if (localMecha) drawMecha(localMecha);
    if (remoteMecha) drawMecha(remoteMecha);
    
    drawParticles();
    drawHealthBars();
    
    ctx.restore();
}

function drawResult(won) {
    drawBattle();
    
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, LOGICAL_WIDTH * SCALE, LOGICAL_HEIGHT * SCALE);
    
    ctx.fillStyle = won ? colors.accent : '#e63946';
    ctx.font = `${20 * SCALE}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText(won ? '🏆 胜利! 🏆' : '💀 失败', LOGICAL_WIDTH / 2 * SCALE, 70 * SCALE);
    
    ctx.fillStyle = colors.text;
    ctx.font = `${8 * SCALE}px monospace`;
    ctx.fillText('[ 再来一局 ]', 130 * SCALE, 143 * SCALE);
    ctx.fillText('[ 返回主菜单 ]', 210 * SCALE, 143 * SCALE);
    
    ctx.textAlign = 'left';
}

let lastTime = 0;
let aiTimer = 0;

function gameLoop(timestamp) {
    const dt = timestamp - lastTime;
    lastTime = timestamp;
    
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    if (gameState === 'menu') {
        drawMenu();
    } else if (gameState === 'select') {
        drawSelectScreen();
        
        if (localMecha) updateMecha(localMecha, dt);
        if (remoteMecha) updateMecha(remoteMecha, dt);
    } else if (gameState === 'battle') {
        if (localMecha) {
            updateMechaFromInput(localMecha, dt);
            updateMecha(localMecha, dt);
        }
        
        if (remoteMecha) {
            updateMecha(remoteMecha, dt);
        }
        
        updateParticles(dt);
        
        if (isOnline && isHost) {
            if (Math.random() < 0.02) {
                const dir = Math.random() < 0.5 ? -1 : 1;
                conn.send({
                    type: 'sync',
                    x: remoteMecha ? remoteMecha.x : 250,
                    state: remoteMecha ? remoteMecha.state : 'idle'
                });
            }
        }
        
        drawBattle();
    } else if (gameState === 'result') {
        const won = localMecha && localMecha.hp > 0;
        drawResult(won);
    }
    
    requestAnimationFrame(gameLoop);
}

function startPractice() {
    document.getElementById('connectionOverlay').classList.add('hidden');
    isOnline = false;
    gameState = 'select';
    localSelection = null;
    remoteSelection = 'flame';
    localMecha = null;
    remoteMecha = createMecha('flame', false, 250);
}

function selectMecha(type) {
    if (gameState !== 'select') return;
    if (isOnline && !isHost) return;
    
    localSelection = type;
    
    if (isOnline && conn) {
        conn.send({ type: 'select', mecha: type });
    }
    
    startBattle();
}

function startBattle() {
    gameState = 'battle';
    
    const localType = localSelection || 'flame';
    const remoteType = remoteSelection || 'frost';
    
    localMecha = createMecha(localType, true, 50);
    remoteMecha = createMecha(remoteType, false, 250);
    
    battleStartTime = Date.now();
    particles = [];
    screenShake = 0;
}

function endBattle(localWon) {
    if (gameState !== 'battle') return;
    gameState = 'result';
    
    if (isOnline && localMecha && conn) {
        conn.send({ type: 'end', won: localMecha.hp > 0 });
    }
}

function restartGame() {
    gameState = 'select';
    localMecha = null;
    remoteMecha = null;
    localSelection = null;
    remoteSelection = null;
    particles = [];
    
    if (isOnline) {
        showConnectionOverlay();
    }
}

function returnToMenu() {
    gameState = 'menu';
    localMecha = null;
    remoteMecha = null;
    localSelection = null;
    remoteSelection = null;
    particles = [];
    
    if (conn) {
        conn.close();
        conn = null;
    }
    if (peer) {
        peer.destroy();
        peer = null;
    }
    isOnline = false;
    
    showConnectionOverlay();
}

function showConnectionOverlay() {
    const overlay = document.getElementById('connectionOverlay');
    overlay.classList.remove('hidden');
    
    document.getElementById('menuSection').classList.remove('hidden');
    document.getElementById('multiplayerSection').classList.add('hidden');
    document.getElementById('createRoomSection').classList.add('hidden');
    document.getElementById('joinRoomSection').classList.add('hidden');
}

function showMenu() {
    document.getElementById('menuSection').classList.remove('hidden');
    document.getElementById('multiplayerSection').classList.add('hidden');
    document.getElementById('createRoomSection').classList.add('hidden');
    document.getElementById('joinRoomSection').classList.add('hidden');
}

function showMultiplayerMenu() {
    document.getElementById('menuSection').classList.add('hidden');
    document.getElementById('multiplayerSection').classList.remove('hidden');
}

function generateRoomCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = '';
    for (let i = 0; i < 6; i++) {
        code += chars[Math.floor(Math.random() * chars.length)];
    }
    return code;
}

function createRoom() {
    const roomCode = generateRoomCode();
    document.getElementById('multiplayerSection').classList.add('hidden');
    document.getElementById('createRoomSection').classList.remove('hidden');
    document.getElementById('roomCodeDisplay').textContent = roomCode;
    document.getElementById('waitingStatus').textContent = '正在初始化连接...';
    
    isHost = true;
    
    peer = new Peer('MECHA-' + roomCode, {
        debug: 1
    });
    
    peer.on('open', (id) => {
        myPlayerId = id;
        document.getElementById('waitingStatus').textContent = '等待玩家加入...\n分享房间码: ' + roomCode;
    });
    
    peer.on('connection', (connection) => {
        conn = connection;
        setupConnection();
        document.getElementById('waitingStatus').textContent = '玩家已连接!';
    });
    
    peer.on('error', (err) => {
        document.getElementById('waitingStatus').textContent = '错误: ' + err.type;
        document.getElementById('waitingStatus').classList.add('error');
    });
    
    peer.on('disconnected', () => {
        document.getElementById('waitingStatus').textContent = '连接断开';
    });
}

function showJoinRoom() {
    document.getElementById('multiplayerSection').classList.add('hidden');
    document.getElementById('joinRoomSection').classList.remove('hidden');
    document.getElementById('joinStatus').textContent = '';
}

function joinRoom() {
    const roomCode = document.getElementById('roomCodeInput').value.trim().toUpperCase();
    
    if (!roomCode) {
        document.getElementById('joinStatus').textContent = '请输入房间码';
        return;
    }
    
    document.getElementById('joinStatus').textContent = '正在连接...';
    
    isHost = false;
    
    peer = new Peer({
        debug: 1
    });
    
    peer.on('open', () => {
        conn = peer.connect('MECHA-' + roomCode, {
            reliable: true
        });
        
        conn.on('open', () => {
            setupConnection();
            document.getElementById('joinStatus').textContent = '连接成功!';
            setTimeout(() => {
                conn.send({ type: 'ready' });
            }, 500);
        });
        
        conn.on('error', (err) => {
            document.getElementById('joinStatus').textContent = '连接失败: ' + err;
            document.getElementById('joinStatus').classList.add('error');
        });
    });
    
    peer.on('error', (err) => {
        document.getElementById('joinStatus').textContent = '错误: ' + err.type;
        document.getElementById('joinStatus').classList.add('error');
    });
}

function setupConnection() {
    conn.on('data', (data) => {
        handleNetworkData(data);
    });
    
    conn.on('close', () => {
        if (gameState === 'battle') {
            alert('对手断开连接');
            returnToMenu();
        }
    });
    
    conn.on('error', (err) => {
        console.error('Connection error:', err);
    });
}

function handleNetworkData(data) {
    if (data.type === 'ready') {
        remoteSelection = 'frost';
        if (isHost && localSelection) {
            startBattle();
        }
    }
    else if (data.type === 'select') {
        remoteSelection = data.mecha;
        if (localSelection) {
            startBattle();
        }
    }
    else if (data.type === 'attack') {
        if (remoteMecha && localMecha) {
            remoteMecha.x = data.x;
            remoteMecha.facing = data.facing;
            remoteMecha.state = 'attack';
            remoteMecha.attackTimer = 300;
            
            const template = mechas[data.mechaType];
            const range = template.attackType === 'melee' ? 40 : 80;
            
            let dx = localMecha.x - remoteMecha.x;
            if (data.facing === 'left') dx = remoteMecha.x - localMecha.x;
            
            if (dx > 0 && dx < range && Math.abs(localMecha.y - remoteMecha.y) < 20) {
                let damage = template.damage;
                if (localMecha.state === 'defend') {
                    damage = Math.floor(damage * 0.3);
                    createDefendEffect(localMecha);
                }
                
                applyDamageToLocal(damage, remoteMecha.facing);
            }
        }
    }
    else if (data.type === 'ultimate') {
        if (remoteMecha && localMecha) {
            remoteMecha.x = data.x;
            remoteMecha.facing = data.facing;
            remoteMecha.state = 'ultimate';
            remoteMecha.attackTimer = 500;
            remoteMecha.energy = 0;
            screenShake = 15;
            
            createUltimateEffect(remoteMecha);
            
            const range = 100;
            let dx = localMecha.x - remoteMecha.x;
            if (data.facing === 'left') dx = remoteMecha.x - localMecha.x;
            
            if (dx > 0 && dx < range && Math.abs(localMecha.y - remoteMecha.y) < 30) {
                let damage = mechas[data.mechaType].ultimateDamage;
                if (localMecha.state === 'defend') {
                    damage = Math.floor(damage * 0.3);
                    createDefendEffect(localMecha);
                }
                
                applyDamageToLocal(damage, remoteMecha.facing);
            }
        }
    }
    else if (data.type === 'damage') {
        if (remoteMecha) {
            remoteMecha.hp = data.targetHp;
            if (remoteMecha.hp <= 0) {
                endBattle(true);
            }
        }
    }
    else if (data.type === 'sync') {
        if (remoteMecha) {
            remoteMecha.x = data.x;
            remoteMecha.state = data.state;
        }
    }
    else if (data.type === 'end') {
        if (data.won) {
            if (localMecha) localMecha.hp = 0;
            endBattle(false);
        }
    }
}

function applyDamageToLocal(damage, attackerFacing) {
    if (!localMecha || localMecha.invincible) return;
    
    localMecha.hp = Math.max(0, localMecha.hp - damage);
    localMecha.state = 'hit';
    localMecha.hitTimer = 200;
    localMecha.invincibleTimer = 300;
    
    const knockback = attackerFacing === 'right' ? -8 : 8;
    localMecha.x += knockback;
    localMecha.x = Math.max(10, Math.min(LOGICAL_WIDTH - 34, localMecha.x));
    
    createHitEffect(localMecha);
    
    if (localMecha.hp <= 0) {
        endBattle(false);
    }
}

function cancelRoom() {
    if (conn) {
        conn.close();
        conn = null;
    }
    if (peer) {
        peer.destroy();
        peer = null;
    }
    showMultiplayerMenu();
}

function initTouchControls() {
    const joystick = document.getElementById('joystick');
    const knob = document.getElementById('joystickKnob');
    const joystickArea = document.getElementById('joystickArea');
    
    const attackBtn = document.getElementById('attackBtn');
    const defendBtn = document.getElementById('defendBtn');
    const ultimateBtn = document.getElementById('ultimateBtn');
    
    function updateJoystickPosition(touch) {
        const rect = joystick.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        
        let dx = touch.clientX - centerX;
        let dy = touch.clientY - centerY;
        
        const maxDist = 35;
        const dist = Math.sqrt(dx * dx + dy * dy);
        
        if (dist > maxDist) {
            dx = dx / dist * maxDist;
            dy = dy / dist * maxDist;
        }
        
        knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        
        input.direction.x = dx / maxDist;
        input.direction.y = dy / maxDist;
    }
    
    joystick.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (joystickTouchId === null) {
            joystickTouchId = e.changedTouches[0].identifier;
            joystick.style.background = 'rgba(255,255,255,0.3)';
            updateJoystickPosition(e.changedTouches[0]);
        }
    });
    
    joystick.addEventListener('touchmove', (e) => {
        e.preventDefault();
        for (let touch of e.changedTouches) {
            if (touch.identifier === joystickTouchId) {
                updateJoystickPosition(touch);
            }
        }
    });
    
    joystick.addEventListener('touchend', (e) => {
        e.preventDefault();
        for (let touch of e.changedTouches) {
            if (touch.identifier === joystickTouchId) {
                joystickTouchId = null;
                knob.style.transform = 'translate(-50%, -50%)';
                input.direction.x = 0;
                input.direction.y = 0;
                joystick.style.background = 'rgba(255,255,255,0.15)';
            }
        }
    });
    
    joystick.addEventListener('touchcancel', (e) => {
        joystickTouchId = null;
        knob.style.transform = 'translate(-50%, -50%)';
        input.direction.x = 0;
        input.direction.y = 0;
        joystick.style.background = 'rgba(255,255,255,0.15)';
    });
    
    function addButtonListener(btn, inputKey) {
        btn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            input[inputKey] = true;
        });
        btn.addEventListener('touchend', (e) => {
            e.preventDefault();
            input[inputKey] = false;
        });
        btn.addEventListener('touchcancel', (e) => {
            e.preventDefault();
            input[inputKey] = false;
        });
    }
    
    addButtonListener(attackBtn, 'attack');
    addButtonListener(defendBtn, 'defend');
    addButtonListener(ultimateBtn, 'ultimate');
}

function initKeyboardControls() {
    document.addEventListener('keydown', (e) => {
        keys[e.code] = true;
        
        if (e.code === 'KeyW' || e.code === 'ArrowUp') input.direction.y = -1;
        if (e.code === 'KeyS' || e.code === 'ArrowDown') input.direction.y = 1;
        if (e.code === 'KeyA' || e.code === 'ArrowLeft') input.direction.x = -1;
        if (e.code === 'KeyD' || e.code === 'ArrowRight') input.direction.x = 1;
        
        if (e.code === 'KeyJ') input.attack = true;
        if (e.code === 'KeyK') input.defend = true;
        if (e.code === 'KeyU') input.ultimate = true;
    });
    
    document.addEventListener('keyup', (e) => {
        keys[e.code] = false;
        
        if (e.code === 'KeyW' || e.code === 'ArrowUp' || e.code === 'KeyS' || e.code === 'ArrowDown') {
            input.direction.y = 0;
        }
        if (e.code === 'KeyA' || e.code === 'ArrowLeft' || e.code === 'KeyD' || e.code === 'ArrowRight') {
            input.direction.x = 0;
        }
        
        if (e.code === 'KeyJ') input.attack = false;
        if (e.code === 'KeyK') input.defend = false;
        if (e.code === 'KeyU') input.ultimate = false;
    });
}

window.addEventListener('resize', initCanvas);

window.addEventListener('load', () => {
    initCanvas();
    initTouchControls();
    initKeyboardControls();
    showConnectionOverlay();
    requestAnimationFrame(gameLoop);
});

document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        input.direction = { x: 0, y: 0 };
        input.attack = false;
        input.defend = false;
        input.ultimate = false;
    }
});
